name: zhiku-standalone

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhiku-rag:standalone
    environment:
      APP_MODE: standalone
      APP_ENV: production
      AUTH_ENABLED: "false"
      SEED_STANDALONE_DATA: "true"
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
