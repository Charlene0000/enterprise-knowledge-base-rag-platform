name: zhiku-full

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.full
    image: zhiku-rag:full
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: full
      APP_ENV: production
      MONGO_URL: mongodb://mongo:27017
      MILVUS_URL: http://milvus:19530
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_PUBLIC_READ: "true"
      RUNTIME_DATA_DIR: /app/data/runtime
      DATA_BASED_ROOT_DIR: /app/data/tasks
      MD_ROOT_DIR: /app/data/temp-files
    ports:
      - "8000:8000"
    volumes:
      - zhiku-runtime:/app/data
      - model-cache:/app/models
    depends_on:
      mongo:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd --advertise-client-urls=http://127.0.0.1:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-change-me}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-now}
    volumes:
      - minio-data:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-change-me}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-change-me-now}
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  zhiku-runtime:
  model-cache:
  mongo-data:
  etcd-data:
  minio-data:
  milvus-data:
