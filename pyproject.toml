[project]
name = "zhiku"
version = "1.0.0"
description = "可评测、可引用、可复现的企业设备知识库 RAG 平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
full = [
    "colorlog>=6.9,<7.0",
    "dashscope>=1.25,<2.0",
    "flagembedding>=1.3,<2.0",
    "grandalf>=0.8,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "minio>=7.2,<8.0",
    "modelscope>=1.30,<2.0",
    "numpy>=2.0,<3.0",
    "openai-agents>=0.6,<1.0",
    "pymilvus[model]>=2.5,<4.0",
    "pymongo>=4.10,<5.0",
    "python-dotenv>=1.0,<2.0",
    "torch>=2.5,<3.0",
    "transformers>=4.45,<5.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
zhiku-evaluate = "scripts.evaluate:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "examples*", "scripts*", "web*"]

[tool.setuptools.package-data]
examples = ["*.md", "*.jsonl"]
"web.page" = ["*.html"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "full: requires the heavyweight full RAG dependencies and services",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
