name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lightweight dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: python -m ruff check app scripts tests

      - name: Secret safety check
        run: python scripts/check_secrets.py

      - name: Unit and API tests with coverage gate
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=75

      - name: Reproduce offline RAG evaluation
        run: python scripts/evaluate.py --top-k 5 --output reports/evaluation-standalone.json

      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.full.yml config --quiet

      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-standalone
          path: reports/evaluation-standalone.json
          if-no-files-found: error
